<header>
    <nav class="nav-container">
        <div class="logo">
            <h1>IVAN SENKIV</h1>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger">
            <span></span>
            <span></span>
            <span></span>

        <ul class="nav-list">

</header>

    <main>
        <h1>Зв'язатися зі мною</h1>

        <section>
            <h2>Мої контактні дані</h2>
            <p>Електронна пошта: <a href="mailto:i.o.senkiv@student.khai.edu">i.o.senkiv@student.khai.edu</a></p>
            <p>Телефон: <a href="tel:+380000000000">+38 (000) 000-00-00</a></p>
        </section>

        <hr>

        <form action="#" method="post">
            <fieldset>
                <legend>Особисті дані</legend>
                <label for="username">Ваше ім'я:</label>
                <input type="text" id="username" name="username" required placeholder="Ім'я Прізвище">
                <br><br>
                <label for="useremail">Ваш Email:</label>
                <input type="email" id="useremail" name="useremail" required placeholder="email@example.com">
            </fieldset>

            <fieldset>
                <legend>Ваше запитання</legend>
                <label for="subject">Тема:</label>
                <select id="subject" name="subject">
                    <option value="collab">Співпраця</option>
                    <option value="help">Допомога</option>
                    <option value="other">Інше</option>
                </select>
                <br><br>
                <label for="msg">Повідомлення:</label><br>
                <textarea id="msg" name="msg" rows="5" cols="40" required placeholder="Введіть ваше повідомлення тут..."></textarea>
            </fieldset>

            <p>Згода на обробку даних:</p>
            <label>
                <input type="checkbox" name="agree" required> Я згоден
            </label>
            <br><br>
            <button type="submit">Надіслати форму</button>
        </form>
    </main>
